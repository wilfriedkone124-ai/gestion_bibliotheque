<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bibliothèque{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'livre_list' %}">Bibliothèque</a>
            <div>
                <a class="btn btn-outline-light btn-sm" href="{% url 'livre_list' %}">Livres</a>
                <a class="btn btn-outline-light btn-sm" href="{% url 'livre_create' %}">Ajouter</a>
                <a class="btn btn-outline-light btn-sm" href="/admin/">Administration</a>
            </div>
        </div>
    </nav>
    <main class="container">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
